{% extends "blog/base.html" %}

{% block title %}Contact Us{% endblock %}

{% block css %}
    <style>
        .form-group .help-block {
            display: none;
        }
        .form-group.has-error .help-block {
            display: block;
        }
        input[name='decoy'],
        p.decoy {
            display: none !important;
        }


    </style>
{% endblock %}

{% block content %}


<div class="container">




  <div class="contact_us_form">

    <h3 ><i class="material-icons">question_answer</i> Contact us</h3><hr/>
    <form action="." method="post" name="feedback">{% csrf_token %}
        <div class="container col-lg-7">

          <div class="form-group row {% if form.name.errors %}has-error{% endif %}">
                <label for="name" class="col-sm-2 control-label">Name</label>
                <div class="col-sm-10">
                    <input style="border:none; border-bottom: 1px solid 	#D3D3D3;border-radius: 0;" type="text" name="name" class="form-control"
                    value="{% if form.data.name %}{{form.data.name}}{% else %}{{form.initial.name}}{% endif %}" />
                </div>
            </div>
            <div class="form-group row {% if form.email.errors %}has-error{% endif %}">
                <label for="email" class="col-sm-2 control-label">E-mail</label>
                <div class="col-sm-10">
                    <input style="border:none; border-bottom: 1px solid 	#D3D3D3;border-radius: 0;" class="form-control" type="text" name="email"
                     value="{% if form.data.email %}{{form.data.email}}{% else %}{{form.initial.email}}{% endif %}" />
                    <div class="visualclear"></div>
                </div>
            </div>

            <div class="form-group row {% if form.subject.errors %}has-error{% endif %}">
                <label for="subject"  class="col-sm-2 control-label">Subject</label>
                <div class="col-sm-10">
                    {{form.subject}}
                </div>
            </div>

            <div class="form-group row {% if form.description.errors %}has-error{% endif %}">
                <label for="description" class="col-sm-2 control-label">Message</label>
                <div class="col-sm-10">
                    {{form.description}}</br>
                    <input class="btn" type="submit" value="Send"/>
                </div>
            </div>





        </div>
    </form>
  </div>







</div>
{% endblock %}
